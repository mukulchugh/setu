# Builds and tests the Setu Links engine from a clean checkout with the toolchain pinned in
# engines/links/rust-toolchain.toml. Prepared locally; it has not run on GitHub yet.
name: links-engine

on:
  pull_request:
    paths:
      - 'engines/links/**'
      - 'links-*.js'
      - 'cli.js'
      - 'cli.test.js'
      - 'portal.js'
      - 'portal-routes.js'
      - 'portal-resource-services.js'
      - 'AGENTS.md'
      - 'package.json'
      - '.github/workflows/links-engine.yml'
  push:
    branches: [main]
    paths:
      - 'engines/links/**'
      - 'links-*.js'
      - 'cli.js'
      - 'cli.test.js'
      - 'portal.js'
      - 'portal-routes.js'
      - 'portal-resource-services.js'
      - 'AGENTS.md'
      - 'package.json'
      - '.github/workflows/links-engine.yml'

permissions:
  contents: read

jobs:
  engine:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          VERSION=$(sed -n 's/^channel = "\(.*\)"/\1/p' engines/links/rust-toolchain.toml)
          rustup toolchain install "$VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$VERSION" >> "$GITHUB_ENV"
          echo "SETU_LINKS_CARGO=$(rustup which --toolchain "$VERSION" cargo)" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Release build repeats identically on this runner
        run: |
          bun run engine:build
          first=$(shasum -a 256 engines/links/target/release/setu-links)
          (cd engines/links && "$SETU_LINKS_CARGO" clean --release -p setu-links)
          bun run engine:build
          second=$(shasum -a 256 engines/links/target/release/setu-links)
          test "$first" = "$second"

      - run: bun run engine:test

      - name: Links contract tests and naming check
        run: >
          bun test ./links-client.test.js ./links-service.test.js ./links-api.test.js ./links-cli.test.js
          ./links-engine-boundary.test.js ./links-naming-check.test.js ./links-engine.test.js
          ./links-packaging.test.js ./cli.test.js ./portal-routes.test.js ./portal.docs.test.js

      - name: Full JavaScript and TypeScript regression suite
        run: bun run test

      - run: bun links-naming-check.js

      - run: bun run typecheck
