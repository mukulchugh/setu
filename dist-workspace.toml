[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# No `ci` key on purpose: releases are built and published locally (scripts/release.sh),
# and without it `dist init` / `dist generate` cannot recreate a GitHub Actions workflow.
# `hosting` replaces what `ci` used to imply: artifacts and the formula point at GitHub releases.
hosting = ["github"]
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# The Homebrew tap. It sets the install hint (`brew install mukulchugh/tap/setu`); release.sh
# pushes the formula itself, so dist's "publish job is disabled" warning is expected.
tap = "mukulchugh/homebrew-tap"
# Customize the Homebrew formula name
formula = "setu"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Setu.app (built by scripts/release.sh via bundle-swift.sh) ships in each archive;
# Homebrew puts it in share/setu and `setu app` installs it into ~/Applications.
include = ["target-swift/Setu.app"]
