[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# Releases are built and published locally (scripts/release.sh); no CI workflow is generated.
ci = "github"
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# A GitHub repo to push Homebrew formulas to
tap = "mukulchugh/homebrew-tap"
# Customize the Homebrew formula name
formula = "setu"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Setu.app (built by scripts/release.sh via bundle-swift.sh) ships in each archive;
# Homebrew puts it in share/setu and `setu app` installs it into ~/Applications.
include = ["target-swift/Setu.app"]
