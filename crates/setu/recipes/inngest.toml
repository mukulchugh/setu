name = "inngest"
description = "Inngest dev server (`brew install inngest/tap/inngest`; the binary is `inngest`), on its own port. It also opens a connect gateway and two gRPC ports; they are leased so worktrees never collide."

[detect]
any_of = [{ dependency = "inngest" }]

[ports]
inngest = {}
inngest_gw = {}
inngest_gw_grpc = {}
inngest_exec_grpc = {}

[env]
INNGEST_DEV = "1"
INNGEST_BASE_URL = "http://127.0.0.1:{port.inngest}"

[procs.inngest]
run = "inngest dev -p {port.inngest} -u http://127.0.0.1:{port.web}/api/inngest --no-discovery --connect-gateway-port {port.inngest_gw} --connect-gateway-grpc-port {port.inngest_gw_grpc} --connect-executor-grpc-port {port.inngest_exec_grpc}"
