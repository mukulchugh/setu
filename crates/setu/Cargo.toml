[package]
name = "setu"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs every worktree's app and workers side by side, each at its own local URL"
repository = "https://github.com/mukulchugh/setu"
homepage = "https://github.com/mukulchugh/setu"
license = "UNLICENSED"

[[bin]]
name = "setu-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "tokio", "http1"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "time", "sync", "process", "macros", "signal", "fs"] }
toml = "1"
turso = { version = "=0.9.0-pre.5", default-features = false }

[package.metadata.dist]
dist = true
